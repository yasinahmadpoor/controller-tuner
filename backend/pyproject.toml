[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-tuner-backend"
version = "0.1.0"
description = "Unified controller tuning platform backend"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pygad==3.9.2",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "redis==6.4.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
