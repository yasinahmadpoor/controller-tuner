[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-tuner-backend"
version = "0.1.0"
description = "Unified controller tuning platform backend"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pygad==3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
