services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tuner
      POSTGRES_PASSWORD: tuner
      POSTGRES_DB: controller_tuner_test
    ports:
      - "65432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuner -d controller_tuner_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test-redis:
    image: redis:7-alpine
    ports:
      - "65433:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
