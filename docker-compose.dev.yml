name: controller-tuner-dev

services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:${UI_PORT:-5173}
      GA_ENGINE_REPO: /engines/gaTunerPID
      MANUAL_ENGINE_REPO: /engines/tunerPID
    volumes:
      - ./backend:/app
      - ./engines/gaTunerPID:/engines/gaTunerPID:ro
      - ./engines/tunerPID:/engines/tunerPID:ro
      - artifacts_data:/data/artifacts

  worker:
    command:
      - sh
      - -c
      - celery -A app.workers.celery_app:celery_app worker -Q ga,maintenance --loglevel=INFO --concurrency=1
    environment:
      APP_ENV: development
      GA_ENGINE_REPO: /engines/gaTunerPID
      MANUAL_ENGINE_REPO: /engines/tunerPID
    volumes:
      - ./backend:/app
      - ./engines/gaTunerPID:/engines/gaTunerPID:ro
      - ./engines/tunerPID:/engines/tunerPID:ro
      - artifacts_data:/data/artifacts

  beat:
    environment:
      APP_ENV: development
      GA_ENGINE_REPO: /engines/gaTunerPID
      MANUAL_ENGINE_REPO: /engines/tunerPID
    volumes:
      - ./backend:/app
      - ./engines/gaTunerPID:/engines/gaTunerPID:ro
      - ./engines/tunerPID:/engines/tunerPID:ro
      - artifacts_data:/data/artifacts

  frontend:
    build: !reset null
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "${UI_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
