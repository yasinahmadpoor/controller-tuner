name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgresql+psycopg://tuner:tuner@localhost:65432/controller_tuner_test
  REDIS_URL: redis://localhost:65433/0
  CELERY_BROKER_URL: redis://localhost:65433/0
  CELERY_RESULT_BACKEND: redis://localhost:65433/1
  TEST_SKIP_DOCKER_FIXTURES: "1"
  ARTIFACT_DIR: ${{ github.workspace }}/backend/data/artifacts-ci

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuner
          POSTGRES_PASSWORD: tuner
          POSTGRES_DB: controller_tuner_test
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U tuner -d controller_tuner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 65433:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify engine sources are unchanged
        run: python scripts/verify_engines.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==9.2.0 pytest-cov==7.0.0 "coverage[toml]==7.11.0" ruff==0.17.3 httpx==0.28.1

      - name: Lint backend
        working-directory: backend
        run: ruff check app tests alembic && ruff format --check app tests alembic

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Test backend with coverage
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run end-to-end smoke test
        run: API_URL=http://localhost:8000/api/v1 python scripts/e2e_smoke.py

      - name: Verify frontend proxy
        run: python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:3000/api/v1/health', timeout=10).status)"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
